name: Repack apk as OpenWrt 25.12 (apk v3)

# 背景：OpenWrt 25.12 起使用 apk-tools 3.x，包格式为 apk v3（ADB 容器）。
# 仓库 openwrt/*.apk 维护的是 apk v2 载荷；本流程把它解开后用 OpenWrt 25.12 SDK
# （apk-tools 3）重新打成 v3，并更新 Release 资产（即"更新 APK 后同步刷新 Release 列表"）：
#   - v3 以原资产名发布（覆盖），v2 原件保留为 <name>-v2.apk
#   - 架构统一为 aarch64_generic / x86_64（rockchip/armv8 SDK 的 ARCH），
#     官方镜像与本项目自编译固件都接受
#   - v2 的 .post-install / .pre-deinstall 钩子改写成 OpenWrt 包脚本（control 段），
#     否则这些点文件混在 data 段里会让 apk v3 解包失败
#
# 触发方式：
#   1) 自动：推送到 main 且改动 openwrt/**.apk（更新 APK 即自动刷新 Release）
#   2) 手动：workflow_dispatch，可选任意分支/标签（便于 PR 分支先行验证发布）

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 目标 release tag（资产将更新到此处）
        required: true
        default: v1.28.0-kdae
      version:
        description: 打包用的版本号（PKG_VERSION）
        required: true
        default: '1.28.0'
      release:
        description: 使用的 OpenWrt 稳定版分支（取该分支最新小版本）
        required: true
        default: '25.12'
  push:
    branches: [main]
    paths:
      - 'openwrt/**.apk'
      - '.github/workflows/repack-apk-v3.yml'

permissions:
  contents: write

concurrency:
  group: repack-apk-v3
  cancel-in-progress: false

env:
  TARGET_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'v1.28.0-kdae' }}
  PKG_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '1.28.0' }}
  OWRT_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release || '25.12' }}

jobs:
  repack:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: daed-kdae-r2s.apk
            sdk_target: rockchip/armv8
            pkgarch: aarch64_generic
          - asset: daed-kdae-r3s.apk
            sdk_target: rockchip/armv8
            pkgarch: aarch64_generic
          - asset: daed-kdae-r4s.apk
            sdk_target: rockchip/armv8
            pkgarch: aarch64_generic
          - asset: daed-kdae-x86.apk
            sdk_target: x86/64
            pkgarch: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y zstd python3 libncurses-dev

      - name: Download OpenWrt ${{ env.OWRT_RELEASE }} SDK
        run: |
          set -euo pipefail
          rel=$(curl -fLsS "https://downloads.openwrt.org/releases/" \
            | grep -oE "href=\"${{ env.OWRT_RELEASE }}\.[0-9]+/\"" | cut -d '"' -f2 | tr -d / | sort -Vu | tail -1)
          test -n "$rel"
          echo "OpenWrt release: $rel"
          tgt="${{ matrix.sdk_target }}"
          sdk=$(curl -fLsS "https://downloads.openwrt.org/releases/${rel}/targets/${tgt}/" \
            | grep -oE 'openwrt-sdk-[^"<]+\.tar\.zst' | head -1)
          test -n "$sdk"
          echo "SDK: $sdk"
          curl -fLsS --retry 3 -o sdk.tar.zst "https://downloads.openwrt.org/releases/${rel}/targets/${tgt}/${sdk}"
          tar --zstd -xf sdk.tar.zst
          ls -d openwrt-sdk-*/ > sdkdir
          cat sdkdir
          echo "OPENWRT_RELEASE=$rel" >> "$GITHUB_ENV"

      - name: Use the repo apk as the v2 payload source
        run: |
          set -euo pipefail
          asset="${{ matrix.asset }}"
          src="openwrt/${asset}"
          test -f "$src" || { echo "缺少 $src"; exit 1; }
          cp "$src" source.apk
          ls -l source.apk
          magic=$(head -c 4 source.apk | od -An -tx1 | tr -d ' \n')
          echo "source magic: $magic"
          if [ "$magic" = "41444264" ]; then
            echo "SOURCE_ALREADY_V3=1" >> "$GITHUB_ENV"
            echo '源已是 apk v3（ADB 容器），跳过重打包'
          else
            echo "SOURCE_ALREADY_V3=0" >> "$GITHUB_ENV"
          fi
          if [ "$magic" = "41444264" ]; then
            cp source.apk v2.apk
            echo "SKIP_V2_ARCHIVE=1" >> "$GITHUB_ENV"
            echo '源已是 apk v3，跳过解包与重打包，也不再伪造 -v2 归档'
            exit 0
          fi
          cp source.apk v2.apk
          python3 - <<'PY'
          import tarfile, os, shutil
          os.makedirs('prebuilt', exist_ok=True)
          with tarfile.open('v2.apk', 'r:*') as tf:
              names = tf.getnames()
              print('tar members:', len(names))
              tf.extractall('prebuilt')
          # apk v2 的元数据与脚本钩子不属于 data 段，v3 里必须去掉
          # （脚本改由 Makefile 的 postinst/prerm 定义）
          for name in os.listdir('prebuilt'):
              if name.startswith('.') and name not in ('.', '..'):
                  p = os.path.join('prebuilt', name)
                  shutil.rmtree(p) if os.path.isdir(p) else os.remove(p)
                  print('removed v2 metadata/hook:', name)
          PY
          find prebuilt -maxdepth 2 | head -20
          test -x prebuilt/usr/bin/daed || { echo 'usr/bin/daed missing'; exit 1; }
          test -e prebuilt/etc/init.d/daed || { echo 'etc/init.d/daed missing'; exit 1; }
          # OpenWrt 是 musl：预编译二进制必须静态链接，否则 SDK 会以
          # "Package daed is missing dependencies for the following libraries: libc.so.6" 失败。
          # 提前给出明确报错，避免只看到 SDK 的晦涩信息。
          if ldd prebuilt/usr/bin/daed >/dev/null 2>&1; then
            echo 'ERROR: usr/bin/daed 是动态链接，OpenWrt(musl) 无法打包。'
            echo '       请用 CGO_ENABLED=0 重新构建（wing 使用纯 Go 的 glebarez/sqlite，无需 CGO）。'
            echo '       示例: CGO_ENABLED=0 GOOS=linux GOARCH=<arch> make ... bundle'
            ldd prebuilt/usr/bin/daed | head -5 || true
            exit 1
          fi
          echo 'static link check: OK'
          # WebUI 可能内嵌在二进制里（rust/Go embed），只有确实存在时才校验
          if [ -s prebuilt/usr/share/daed/web/index.html ]; then
            echo "HAS_WEB=1" >> "$GITHUB_ENV"
          else
            echo "HAS_WEB=0" >> "$GITHUB_ENV"
            echo 'note: no on-disk WebUI in the payload (embedded in the binary)'
          fi
          left=$(find prebuilt -mindepth 1 -name '.*' | wc -l)
          echo "dot entries left: $left"
          [ "$left" = 0 ] || { echo 'dot files left in data tree'; exit 1; }
          file prebuilt/usr/bin/daed

      - name: Build apk v3 with the OpenWrt SDK
        if: env.SOURCE_ALREADY_V3 != '1'
        run: |
          set -euo pipefail
          sdkdir=$(cat sdkdir)
          pkg="$sdkdir/package/repack"
          mkdir -p "$pkg/daed-kdae"
          cp -a prebuilt "$pkg/daed-kdae/prebuilt"
          cat > "$pkg/daed-kdae/Makefile" <<EOF
          include \$(TOPDIR)/rules.mk

          PKG_NAME:=daed-kdae
          PKG_VERSION:=${{ env.PKG_VERSION }}
          PKG_RELEASE:=1
          PKGARCH:=${{ matrix.pkgarch }}

          include \$(INCLUDE_DIR)/package.mk

          define Package/daed
            SECTION:=net
            CATEGORY:=Network
            TITLE:=daed (kdae Go engine) repacked as apk v3
            URL:=https://github.com/Quan-0505/daed-kdae
          endef

          define Package/daed/description
            Prebuilt daed (kdae Go engine) with its WebUI, repacked from the apk v2 payload
            with the OpenWrt ${{ env.OWRT_RELEASE }} SDK so apk-tools 3 can install it.
          endef

          # v2 的 .post-install / .pre-deinstall 等价物，放进 control 段
          define Package/daed/postinst
          #!/bin/sh
          [ -n "\$\${IPKG_INSTROOT:-}" ] && exit 0
          mkdir -p /etc/daed /tmp/log/daed
          if [ -x /etc/init.d/daed ]; then
          	/etc/init.d/daed enable 2>/dev/null || true
          	/etc/init.d/daed restart 2>/dev/null || true
          fi
          exit 0
          endef

          define Package/daed/prerm
          #!/bin/sh
          if [ -x /etc/init.d/daed ]; then
          	/etc/init.d/daed stop 2>/dev/null || true
          	/etc/init.d/daed disable 2>/dev/null || true
          fi
          exit 0
          endef

          define Build/Prepare
          endef
          define Build/Configure
          endef
          define Build/Compile
          endef

          define Package/daed/install
          	\$(CP) \$(CURDIR)/prebuilt/. \$(1)/
          endef

          \$(eval \$(call BuildPackage,daed))
          EOF
          cd "$sdkdir"
          echo 'CONFIG_PACKAGE_daed-kdae=m' >> .config
          make defconfig >/dev/null 2>&1 || true
          make package/repack/daed-kdae/compile -j"$(nproc)" V=s 2>&1 | tail -30
          echo '--- results ---'
          find -L bin -type f -name '*.apk' | sort

      - name: Verify the apk is v3 and installable
        run: |
          set -euo pipefail
          sdkdir=$(cat sdkdir)
          apk="$PWD/$sdkdir/staging_dir/host/bin/apk"
          if [ "${SOURCE_ALREADY_V3:-0}" = 1 ]; then
            src="$PWD/source.apk"
          else
            mapfile -t pkgs < <(find -L "$sdkdir/bin" -type f -name '*.apk' | sort)
            test "${#pkgs[@]}" -gt 0
            src="${pkgs[0]}"
          fi
          echo "built: $src"
          echo -n 'magic: '; head -c 4 "$src" | od -An -tx1
          head -c 4 "$src" | grep -q 'ADB' || { echo 'not an apk v3 (ADB) container'; exit 1; }
          rm -rf verify && mkdir -p verify
          echo '--- apk extract ---'
          if ! "$apk" extract --allow-untrusted --destination "$PWD/verify" "$src" 2>&1; then
            echo '--- apk extract FAILED, diagnostics ---'
            "$apk" --version || true
            "$apk" info --allow-untrusted "$src" 2>&1 | head -20 || true
            exit 1
          fi
          find verify -maxdepth 3 | head -20
          test -x verify/usr/bin/daed
          test -e verify/etc/init.d/daed
          if [ "${HAS_WEB:-0}" = 1 ]; then test -s verify/usr/share/daed/web/index.html; fi
          file verify/usr/bin/daed
          mkdir -p out
          cp "$src" "out/${{ matrix.asset }}"
          (cd out && sha256sum * > sha256sums.txt && cat sha256sums.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: apk-v3-${{ matrix.asset }}
          path: out/
          if-no-files-found: error

      - name: Publish v3 as the canonical asset and keep the v2 copy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="${{ matrix.asset }}"
          base="$(basename "$asset" .apk)"
          # 每个机型一份 v2 备份，避免多个矩阵任务互相覆盖成同一个 v2.apk。
          # 源本来就是 v3 时不生成归档（否则会把 v3 内容挂到 -v2 名下，误导使用者）。
          if [ "${SKIP_V2_ARCHIVE:-0}" = 1 ]; then
            echo "${base}-v2.apk 跳过：原始 v2 载荷不可得（当前规范资产本就已是 v3）"
          else
            cp v2.apk "${base}-v2.apk"
            gh release upload "${{ env.TARGET_TAG }}" "${base}-v2.apk" --clobber
          fi
          gh release upload "${{ env.TARGET_TAG }}" "out/$asset" --clobber
          gh release view "${{ env.TARGET_TAG }}" --json assets --jq '.assets[] | "\(.name)\t\(.size)"'
