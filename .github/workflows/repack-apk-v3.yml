name: Repack apk as OpenWrt 25.12 (apk v3)

# 背景：OpenWrt 25.12 起使用 apk-tools 3.x，包格式为 apk v3（ADB 容器）。
# 本仓库历史上发布的 *.apk 是 apk v2 格式，在 25.12 上会直接报
#   ERROR: ...: v2 package format error
# 本流程把 v2 包解包后用 OpenWrt 25.12 SDK（apk-tools 3）重新打成 v3：
#   - v3 包以原资产名发布（覆盖），v2 原件保留为 <name>-v2.apk
#   - 架构统一声明为 aarch64_generic / x86_64，兼容官方镜像与本项目自编译固件

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 存放 v2 apk 的 release tag
        required: true
        default: v1.28.0-kdae
      version:
        description: 打包用的版本号（PKG_VERSION）
        required: true
        default: '1.28.0'
      release:
        description: 使用的 OpenWrt 稳定版分支（取该分支最新小版本）
        required: true
        default: '25.12'

permissions:
  contents: write

concurrency:
  group: repack-apk-v3
  cancel-in-progress: false

jobs:
  repack:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: daed-kdae-r2s.apk
            sdk_target: rockchip/armv8
            pkgarch: aarch64_generic
          - asset: daed-kdae-r3s.apk
            sdk_target: rockchip/armv8
            pkgarch: aarch64_generic
          - asset: daed-kdae-r4s.apk
            sdk_target: rockchip/armv8
            pkgarch: aarch64_generic
          - asset: daed-kdae-x86.apk
            sdk_target: x86/64
            pkgarch: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y zstd python3 libncurses-dev

      - name: Download OpenWrt ${{ inputs.release }} SDK
        run: |
          set -euo pipefail
          rel=$(curl -fLsS "https://downloads.openwrt.org/releases/" \
            | grep -oE "href=\"${{ inputs.release }}\.[0-9]+/\"" | cut -d '"' -f2 | tr -d / | sort -Vu | tail -1)
          test -n "$rel"
          echo "OpenWrt release: $rel"
          tgt="${{ matrix.sdk_target }}"
          sdk=$(curl -fLsS "https://downloads.openwrt.org/releases/${rel}/targets/${tgt}/" \
            | grep -oE 'openwrt-sdk-[^"<]+\.tar\.zst' | head -1)
          test -n "$sdk"
          echo "SDK: $sdk"
          curl -fLsS --retry 3 -o sdk.tar.zst "https://downloads.openwrt.org/releases/${rel}/targets/${tgt}/${sdk}"
          tar --zstd -xf sdk.tar.zst
          ls -d openwrt-sdk-*/ > sdkdir
          cat sdkdir
          echo "OPENWRT_RELEASE=$rel" >> "$GITHUB_ENV"

      - name: Fetch and unpack the apk v2 payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="${{ matrix.asset }}"
          gh release download "${{ inputs.tag }}" -p "$asset" -O v2.apk --clobber
          ls -l v2.apk
          python3 - <<'PY'
          import tarfile, os
          os.makedirs('prebuilt', exist_ok=True)
          with tarfile.open('v2.apk', 'r:*') as tf:
              names = tf.getnames()
              print('tar members:', len(names))
              tf.extractall('prebuilt')
          for k in ('.PKGINFO',):
              print('has', k, os.path.exists(os.path.join('prebuilt', k)))
          PY
          # 去掉 v2 的元数据目录，只保留实际文件树
          rm -rf prebuilt/.PKGINFO prebuilt/.SIGN.* || true
          find prebuilt -maxdepth 2 | head -20
          test -x prebuilt/usr/bin/daed || { echo 'usr/bin/daed missing'; exit 1; }
          file prebuilt/usr/bin/daed

      - name: Build apk v3 with the OpenWrt SDK
        run: |
          set -euo pipefail
          sdkdir=$(cat sdkdir)
          pkg="$sdkdir/package/repack"
          mkdir -p "$pkg/daed-kdae"
          cp -a prebuilt "$pkg/daed-kdae/prebuilt"
          cat > "$pkg/daed-kdae/Makefile" <<EOF
          include \$(TOPDIR)/rules.mk

          PKG_NAME:=daed-kdae
          PKG_VERSION:=${{ inputs.version }}
          PKG_RELEASE:=1
          PKGARCH:=${{ matrix.pkgarch }}

          include \$(INCLUDE_DIR)/package.mk

          define Package/daed
            SECTION:=net
            CATEGORY:=Network
            TITLE:=DaeNext rust-native daemon (repacked as apk v3)
            URL:=https://github.com/Quan-0505/daed-kdae
          endef

          define Package/daed/description
            Prebuilt daed (kdae Go engine) with its WebUI, repacked from the apk v2 payload
            with the OpenWrt ${{ inputs.release }} SDK so apk-tools 3 can install it.
          endef

          define Build/Prepare
          endef
          define Build/Configure
          endef
          define Build/Compile
          endef

          define Package/daed/install
          	\$(CP) \$(CURDIR)/prebuilt/. \$(1)/
          endef

          \$(eval \$(call BuildPackage,daed))
          EOF
          cd "$sdkdir"
          echo 'CONFIG_PACKAGE_daed-kdae=m' >> .config
          make defconfig >/dev/null 2>&1 || true
          make package/repack/daed-kdae/compile -j"$(nproc)" V=s 2>&1 | tail -30
          echo '--- results ---'
          find -L bin -type f -name '*.apk' | sort

      - name: Verify the apk is v3 and installable
        run: |
          set -euo pipefail
          sdkdir=$(cat sdkdir)
          apk="$PWD/$sdkdir/staging_dir/host/bin/apk"
          mapfile -t pkgs < <(find -L "$sdkdir/bin" -type f -name '*.apk' | sort)
          test "${#pkgs[@]}" -gt 0
          src="${pkgs[0]}"
          echo "built: $src"
          echo -n 'magic: '; head -c 4 "$src" | od -An -tx1
          head -c 4 "$src" | grep -q 'ADB' || { echo 'not an apk v3 (ADB) container'; exit 1; }
          rm -rf verify && mkdir -p verify
          "$apk" extract --allow-untrusted --destination "$PWD/verify" "$src"
          test -x verify/usr/bin/daed
          test -s verify/usr/share/daed/web/index.html
          test -x verify/etc/init.d/daed
          file verify/usr/bin/daed
          mkdir -p out
          cp "$src" "out/${{ matrix.asset }}"
          (cd out && sha256sum * > sha256sums.txt && cat sha256sums.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: apk-v3-${{ matrix.asset }}
          path: out/
          if-no-files-found: error

      - name: Publish v3 as the canonical asset and keep the v2 copy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="${{ matrix.asset }}"
          v2="$(basename "$asset" .apk)-v2.apk"
          # 先保留 v2 原件（幂等）
          gh release upload "${{ inputs.tag }}" v2.apk#"$v2" --clobber
          # 再用 v3 覆盖规范资产名
          gh release upload "${{ inputs.tag }}" "out/$asset" --clobber
          gh release view "${{ inputs.tag }}" --json assets --jq '.assets[] | "\(.name)\t\(.size)"'
