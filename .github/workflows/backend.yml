name: Pinned Go backend checks
on:
  push:
    paths: ['backend/**', 'packaging/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'packaging/**', '.github/workflows/backend.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - run: pnpm --dir console install --frozen-lockfile && npm run build
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - run: sudo apt-get update -qq && sudo apt-get install -y clang llvm libelf-dev
      - run: python3 -m unittest discover -s backend/tests -p 'test_*.py'
      - run: python3 backend/prepare-wing.py "$RUNNER_TEMP/wing" --clone
      - name: Generate eBPF and GraphQL, test native features, build controller
        working-directory: ${{ runner.temp }}/wing
        run: |
          make deps
          go test -race ./dae ./maintenance ./observability ./consoleapi ./graphql ./graphql/service/...
          (cd dae-core && go test ./component/sniffing ./component/dns ./component/outbound/dialer ./control)
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/daed" .
      - name: Build verified ARM64 console for router validation
        working-directory: ${{ runner.temp }}/wing
        run: |
          CGO_ENABLED=0 make OUTPUT="$RUNNER_TEMP/daed" APPNAME=daed WEB_DIST="$GITHUB_WORKSPACE/dist" VERSION="v2.2.5-kdae" bundle
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags=embedallowed -trimpath -ldflags="-s -w -X github.com/daeuniverse/dae-wing/db.AppVersion=v2.2.5-kdae -X github.com/daeuniverse/dae-wing/db.AppName=daed" -o "$RUNNER_TEMP/daed-arm64" .
          sha256sum "$RUNNER_TEMP/daed-arm64" > "$RUNNER_TEMP/daed-arm64.sha256"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/source-commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: kdae-arm64-upstream-20261015
          path: |
            ${{ runner.temp }}/daed-arm64
            ${{ runner.temp }}/daed-arm64.sha256
            ${{ runner.temp }}/source-commit.txt
